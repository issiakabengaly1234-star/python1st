{% extends "base.html" %}
{% block title %}Mon profil{% endblock %}
{% block content %}
<header class="page-head"><h1>Mon profil d'éleveur</h1></header>
<form method="post" class="card form-card" novalidate>
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}{% include "core/_field.html" %}{% endfor %}
  <div class="form-actions"><button class="btn" type="submit">Enregistrer</button></div>
</form>
{% endblock %}
